apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mail-test
resources:
  - deployment.yaml
  - service.yaml
# Where the probe Job sends its mail and reads the API (no credential here).
configMapGenerator:
  - name: probe-target
    literals:
      - MODE=smtp4dev
      - SMTP_HOST=mail
      - SMTP_PORT=2525
      - HTTP_HOST=mail
      - HTTP_PORT=5000
      - API_PATH=/api/messages
generatorOptions:
  disableNameSuffixHash: true
