# The probe Job: busybox 1.37.0 pinned by digest (the one of BENCH-009), run
# under the Restricted profile. Credentials reach it as environment variables
# taken from the Secret mail-ui-auth, never as arguments.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "/probe/probe.sh"]
          envFrom:
            - configMapRef: {name: probe-target}
          env:
            - name: UI_USER
              valueFrom:
                secretKeyRef: {name: mail-ui-auth, key: username}
            - name: UI_PASS
              valueFrom:
                secretKeyRef: {name: mail-ui-auth, key: password}
          volumeMounts:
            - {name: probe, mountPath: /probe, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: probe
          configMap: {name: probe-script}
