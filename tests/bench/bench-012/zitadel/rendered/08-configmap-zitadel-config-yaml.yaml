# Source: zitadel/templates/configmap_zitadel.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config-yaml
  namespace: bench-idp
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
  labels:
    helm.sh/chart: zitadel-10.5.0
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: zitadel
    app.kubernetes.io/version: "v4.20.5"
    app.kubernetes.io/managed-by: Helm
data:
  zitadel-config-yaml: |-
    ExternalDomain: idp.bench.test
    ExternalPort: 8080
    ExternalSecure: false
    FirstInstance:
      Org:
        Machine:
          Machine:
            Name: Automatically Initialized IAM Admin
            Username: iam-admin
          MachineKey:
            ExpirationDate: "2029-01-01T00:00:00Z"
            Type: 1
          Pat:
            ExpirationDate: "2029-01-01T00:00:00Z"
      Skip: false
    Machine:
      Identification:
        Hostname:
          Enabled: true
        Webhook:
          Enabled: false
    SystemAPIUsers:
      login-client:
        Memberships:
        - MemberType: System
          Roles:
          - IAM_LOGIN_CLIENT
        Path: /secrets/login-client/tls.crt
    TLS:
      Enabled: false
