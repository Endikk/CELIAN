# BENCH-005, Docker Compose option: the same stack without Kubernetes.
# PG_PASSWORD comes from an env file generated by `task up` (principle IX).
# Published ports listen on 127.0.0.1 only (R-20).
name: celian-bench-005

services:
  postgres:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    container_name: celian-bench-005-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?generated by task up}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s

  valkey:
    image: valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
    container_name: celian-bench-005-valkey
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s

  api:
    build: ./api
    container_name: celian-bench-005-api
    ports: ["127.0.0.1:18580:8080"]
    develop:
      watch:
        - action: rebuild
          path: ./api
          ignore: [bin/, obj/]

  front:
    build: ./front
    container_name: celian-bench-005-front
    ports: ["127.0.0.1:18581:8080"]
    develop:
      watch:
        - action: sync
          path: ./front/html
          target: /usr/share/nginx/html

  probe:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: celian-bench-005-probe
    command: [sh, /probe/probe.sh]
    environment:
      API_URL: http://api:8080/healthz
      FRONT_URL: http://front:8080/
      PG_HOST: postgres
      PG_PORT: "5432"
      CACHE_HOST: valkey
      CACHE_PORT: "6379"
    volumes:
      - ./probe.sh:/probe/probe.sh:ro
