# BENCH-005 probe, test harness only. The script lives in the ConfigMap
# probe-script, created by the benchmark from probe.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  labels: {app: probe}
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe}
  template:
    metadata:
      labels: {app: probe}
    spec:
      containers:
        - name: probe
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: [sh, /probe/probe.sh]
          env:
            - {name: API_URL, value: "http://api:8080/healthz"}
            - {name: FRONT_URL, value: "http://front:8080/"}
            - {name: PG_HOST, value: postgres}
            - {name: PG_PORT, value: "5432"}
            - {name: CACHE_HOST, value: valkey}
            - {name: CACHE_PORT, value: "6379"}
          volumeMounts:
            - {name: script, mountPath: /probe}
      volumes:
        - name: script
          configMap: {name: probe-script}
