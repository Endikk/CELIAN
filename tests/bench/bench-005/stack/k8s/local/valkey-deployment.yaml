apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: {app: valkey}
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [valkey-cli, ping]}
            periodSeconds: 5
