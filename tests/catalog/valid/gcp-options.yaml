# Valid: the gcp target lists a managed option and a self-hosted option
# (constitution 2.0.0, principle III; ADR-009, complement of 2026-11-26).
# Fictitious data for the catalog check tests: nothing here describes a real
# product. The self-hosted option has no managed_gap: nothing asks a cloud
# component to justify the absence of a managed service any more.
schema_version: 1
id: gcp-options
summary: Brique fictive avec une option managée et une option auto-hébergée sur gcp.
declared_by: spec
