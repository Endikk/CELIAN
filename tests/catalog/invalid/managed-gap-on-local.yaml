# 2026-11-26), and the local target takes open source only.
# Based on tests/catalog/valid/minimal.yaml, with targets.local.managed_gap
# added.
# Expected error, and only this one:
#   path: targets/local   validator: additionalProperties
#   message: Additional properties are not allowed ('managed_gap' was unexpected)
