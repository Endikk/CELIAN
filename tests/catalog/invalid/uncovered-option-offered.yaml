# Must fail: an option the validation matrix does not cover, marked as offered
# to the interview. An uncovered option is never proposed (principles I and
# III).
# Based on tests/catalog/valid/gcp-options.yaml, with offered set to true on the
# self-hosted option, whose validation is not-covered.
# Expected error, and only this one:
#   path: targets/gcp/1/offered   validator: const
#   message: False was expected
schema_version: 1
id: minimal
summary: Brique fictive avec une option managée et une option auto-hébergée sur gcp.
declared_by: spec
targets:
