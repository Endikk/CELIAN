# Must fail: no upstream release for twelve calendar months, an eliminating
# criterion of principle VI. The tests run it with today injected as
# 2026-11-19.
# Based on tests/catalog/valid/minimal.yaml, with the id set to the file name
# and targets.local.last_release_on set one year back.
# Expected error, and only this one:
#   path: targets/local/last_release_on   rule: release-age
#   message: no upstream release since 2025-11-19: the twelve-month limit of principle VI was reached on 2026-11-19
schema_version: 1
id: release-older-than-12-months
summary: Brique fictive pour les tests du contrôle du catalogue.
declared_by: spec
targets:
  local:
    type: oss
    service: Example OSS
    version: "1.0.0"
    license: Apache-2.0
    governance:
      model: foundation
      body: Example Foundation
    status: active
    last_release_on: "2025-11-19"
    verified_on: "2026-11-19"
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/oss
        read_on: "2026-11-19"
  gcp:
    type: managed
    service: Example Managed
    provider: google
    governance:
      model: single-vendor
      body: Example Provider
    status: active
    verified_on: "2026-11-19"
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/managed
        read_on: "2026-11-19"
