# Must fail: a string that ends with a line break. The folded block style
# without "-" keeps the final line break, and the schema pattern lets it
# through because python-jsonschema evaluates pattern with re.search, where
# "$" also matches just before a final newline (ADR-009, consequences).
# Based on tests/catalog/valid/minimal.yaml, with the id set to the file name
# and the summary written as a folded block.
# Expected error, and only this one:
#   path: summary   rule: trailing-newline
#   message: the string ends with a line break: write it on one line, or end the block with ">-" or "|-"
schema_version: 1
id: trailing-newline
summary: >
  Brique fictive pour les tests du contrôle du catalogue.
declared_by: spec
targets:
  local:
    type: oss
    service: Example OSS
    version: "1.0.0"
    license: Apache-2.0
    governance:
      model: foundation
      body: Example Foundation
    status: active
    last_release_on: "2026-11-01"
    verified_on: "2026-11-19"
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/oss
        read_on: "2026-11-19"
  gcp:
    type: managed
    service: Example Managed
    provider: google
    governance:
      model: single-vendor
      body: Example Provider
    status: active
    verified_on: "2026-11-19"
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/managed
        read_on: "2026-11-19"
