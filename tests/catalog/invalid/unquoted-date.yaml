    type: oss
    service: Example OSS
    version: "1.0.0"
    license: Apache-2.0
    governance:
      model: foundation
      body: Example Foundation
    status: active
    last_release_on: "2026-11-01"
    verified_on: 2026-11-19
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/oss
        read_on: "2026-11-19"
  gcp:
    type: managed
    service: Example Managed
    provider: google
    governance:
      model: single-vendor
      body: Example Provider
    status: active
    verified_on: "2026-11-19"
    standards: []
    decisions:
      adr: [ADR-009]
    sources:
      - url: https://example.invalid/managed
        read_on: "2026-11-19"
