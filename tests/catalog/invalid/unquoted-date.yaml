# Must fail: a date without quotes, which PyYAML reads as a Python date
# (ADR-009, section 1).
# Based on tests/catalog/valid/minimal.yaml, with the quotes removed around
# targets.local.verified_on.
# Expected error, and only this one:
#   path: targets/local/verified_on   validator: type
#   message: unquoted date 2026-11-19: write it as a quoted string, "2026-11-19"
schema_version: 1
id: minimal
summary: Brique fictive pour les tests du contrôle du catalogue.
declared_by: spec
targets:
