# Catalog entry. Format and procedure: catalog/README.md.
# Schema: schema/catalog-entry.schema.json. Decision: docs/adr/ADR-005-gateway.md.
# The id and declared_by are provisional: ADR-005 leaves both to phase 3, with
# the spec schema.
schema_version: 1
id: gateway
summary: Point d'entrée HTTP et HTTPS du projet généré, qui expose l'API et le front par Gateway API.
declared_by: spec
targets:
  local:
    type: oss
    service: Envoy Gateway
    version: "1.10.0"
    license: Apache-2.0
    governance:
      model: foundation
      body: CNCF
      detail: Projet de l'organisation envoyproxy, couvert par la CNCF au titre d'Envoy (gradué le 2018-11-28), sans statut CNCF propre.
    status: active
    last_release_on: "2026-11-17"
    verified_on: "2026-11-20"
    standards: [gateway-api]
    decisions:
      adr: [ADR-005]
      bench: [BENCH-004]
    sources:
      - url: https://github.com/envoyproxy/gateway
        read_on: "2026-11-20"
        establishes: Licence Apache-2.0, dépôt non archivé de l'organisation envoyproxy (API des dépôts de GitHub).
      - url: https://api.github.com/repos/envoyproxy/gateway/releases?per_page=10
        read_on: "2026-11-20"
        establishes: v1.10.0 publiée le 2026-11-06, release marquée Latest ; dernière release du projet v1.9.4, le 2026-11-17 ; aucune release 1.10.x après 1.10.0.
      - url: https://gateway.envoyproxy.io/news/releases/matrix/
        read_on: "2026-11-20"
        establishes: 1.10 avec Envoy distroless-v1.40.x et Gateway API v1.6.1, pour Kubernetes 1.34 à 1.37, fin de vie le 2027-05-05.
      - url: https://www.cncf.io/projects/envoy/
        read_on: "2026-11-20"
        establishes: Envoy accepté à la CNCF le 2017-09-13, gradué le 2018-11-28 ; Envoy Gateway n'y figure que dans le titre d'un programme enregistré.
      - url: https://github.com/envoyproxy/gateway/blob/main/GOVERNANCE.md
        read_on: "2026-11-20"
        establishes: Comité de pilotage à six sièges, dont celui des mainteneurs du proxy Envoy ; sièges d'entreprises arrivés à échéance le 2025-12-30, fichier inchangé depuis le 2025-03-04.
    notes: >-
      Les CRD Gateway API du canal standard, les deux charts et les images
      vivent dans la couche local du blueprint, figés par condensat (ADR-005),
      et non dans le catalogue. Le correctif attendu de CVE-2026-97054 (ADR-005)
      demande une release 1.10.x après 1.10.0 : aucune le 2026-11-20.
  gcp:
    type: managed
    service: Contrôleur Gateway de GKE
    provider: google
    governance:
      model: single-vendor
      body: Google
      detail: Implémentation de Gateway API par Google pour Cloud Load Balancing, fournie par GKE.
    status: active
    verified_on: "2026-11-25"
    standards: [gateway-api]
    decisions:
      adr: [ADR-005]
    sources:
      - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/gateway-api
        read_on: "2026-11-20"
        establishes: Contrôleur Gateway de GKE, « Google's implementation of the Gateway API for Cloud Load Balancing » ; les deux contrôleurs, mono et multi-cluster, en GA.
      - url: https://github.com/hashicorp/terraform-provider-google/blob/v8.12.0/website/docs/r/container_cluster.html.markdown
        read_on: "2026-11-25"
        establishes: Bloc gateway_api_config de google_container_cluster, argument channel obligatoire, valeurs CHANNEL_DISABLED, CHANNEL_EXPERIMENTAL ou CHANNEL_STANDARD (provider google 8.12.0).
    pending:
      - topic: gateway-class
        owner: OPS
        note: Classe GKE à fixer avec FINOPS ; gke-l7-global-external-managed a servi dans BENCH-004. La couche gcp du golden repo la laisse aux manifests de l'étape 14.
    notes: >-
      Activation dans la couche OpenTofu : gateway_api_config avec channel =
      CHANNEL_STANDARD (RS-16). Chaque Gateway crée sur GKE un équilibreur de
      charge facturé, hors de l'état OpenTofu : son application relève du
      principe X (ADR-005).
