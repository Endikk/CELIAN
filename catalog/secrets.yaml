# Catalog entry. Format and procedure: catalog/README.md.
# Schema: schema/catalog-entry.schema.json. Decision: docs/adr/ADR-007-secrets.md.
# The id and declared_by are provisional: ADR-007 leaves both to phase 3, with
# the spec schema. BENCH-007 puts the name and keys of each Secret in the spec.
schema_version: 1
id: secrets
summary: Secrets fournis à l'application sous forme de Secrets Kubernetes, de même nom et de mêmes clés sur chaque cible.
declared_by: spec
targets:
  local:
    type: oss
    service: API Secret de Kubernetes
    version: "1.36.4"
    license: Apache-2.0
    governance:
      model: foundation
      body: CNCF
      detail: API du cœur de Kubernetes, projet gradué à la CNCF le 2018-03-06.
    status: active
    last_release_on: "2026-10-28"
    verified_on: "2026-11-20"
    standards: [kubernetes-api]
    decisions:
      adr: [ADR-007]
      bench: [BENCH-007]
    sources:
      - url: https://kubernetes.io/docs/concepts/configuration/secret/
        read_on: "2026-11-20"
        establishes: Objet Secret de l'API v1 ; « stored unencrypted in the API server's underlying data store (etcd) » par défaut.
      - url: https://github.com/kubernetes/kubernetes
        read_on: "2026-11-20"
        establishes: Licence Apache-2.0, dépôt non archivé (API des dépôts de GitHub).
      - url: https://api.github.com/repos/kubernetes/kubernetes/releases?per_page=20
        read_on: "2026-11-20"
        establishes: v1.37.2 et v1.36.6 publiées le 2026-10-28, dernières releases hors préversions ; v1.36.4 publiée le 2026-08-20.
      - url: https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md
        read_on: "2026-11-20"
        establishes: v1.37.2 figure au changelog officiel, après v1.37.1.
      - url: https://kubernetes.io/releases/
        read_on: "2026-11-20"
        establishes: Fin de vie de 1.36 le 2027-06-28 ; la page affiche encore 1.37.1 et 1.36.5, datées du 2026-09-15.
      - url: https://www.cncf.io/projects/kubernetes/
        read_on: "2026-11-20"
        establishes: Kubernetes accepté à la CNCF le 2016-03-10, gradué le 2018-03-06.
    notes: >-
      La version suit l'image de nœud de la règle de version de l'ADR-004 et ne
      tient pas sa propre valeur. Les Secrets sont créés par task up sous la
      condition 1 de l'ADR-007, sans outil ajouté au cluster. Ils restent en
      clair dans etcd (R-28).
  gcp:
    type: managed
    service: Secret Manager, synchronisé en Secrets Kubernetes par GKE
    provider: google
    governance:
      model: single-vendor
      body: Google
      detail: Service managé de Google Cloud ; synchronisation intégrée à GKE par SecretProviderClass et SecretSync.
    status: active
    verified_on: "2026-11-25"
    standards: [kubernetes-api]
    decisions:
      adr: [ADR-007]
      bench: [BENCH-007]
    sources:
      - url: https://github.com/hashicorp/terraform-provider-google/blob/v8.12.0/website/docs/r/container_cluster.html.markdown
        read_on: "2026-11-25"
        establishes: Bloc secret_sync_config de google_container_cluster, enabled obligatoire, rotation_config facultatif avec enabled et rotation_interval, intervalle par défaut de 2 minutes (provider google 8.12.0).
      - url: https://docs.cloud.google.com/secret-manager/docs/sync-k8-secrets
        read_on: "2026-11-20"
        establishes: GKE 1.33 ou plus, Standard et Autopilot, Workload Identity requise ; secret-sync.gke.io/v1 SecretSync, provider gke ; région du secret égale à celle du cluster ; rien sur le prix ni sur un Secret existant.
      - url: https://docs.cloud.google.com/secret-manager/docs/release-notes
        read_on: "2026-11-20"
        establishes: Synchronisation intégrée en preview le 2025-10-13, en GA le 2026-04-16.
    pending:
      - topic: secret-region
        owner: OPS
        note: « The secret version must be in the same region as the cluster » ; un secret global convient-il ? Tranché au test de la condition 3 de l'ADR-007.
      - topic: existing-secret
        owner: OPS
        note: Conduite de la synchronisation face à un Secret existant de même nom, non documentée ; tranchée au test de la condition 3 de l'ADR-007.
      - topic: sync-billing
        owner: FINOPS
        note: Facturation de la synchronisation, absente de la page de la fonction.
    notes: >-
      Activation dans la couche OpenTofu : secret_sync_config avec enabled =
      true, sans rotation_config (RS-16). Le golden repo ne pose pas
      d'intervalle de rotation, question de l'ADR-007 laissée à la condition 3.
