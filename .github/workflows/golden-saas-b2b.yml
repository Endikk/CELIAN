name: golden-saas-b2b

# CI of the SaaS B2B golden repo (spec 001, research RS-17). Each job calls
# a task or a test script of golden/saas-b2b/, so that the logic exists once.
# No path filter: a required check whose workflow a filter skips stays
# "Pending" and blocks the merge (research RS-17), and the static job is fast.
# Principle X: no cloud credential, and no plan, apply or destroy; test S17
# (golden/saas-b2b/tests/static/s17-workflows.sh) enforces both.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# The kubectl of the jobs: static renders the common layer with its
# Kustomize (S06, research RS-01), e2e-lite drives the cluster.
env:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: v1.36.6
  # SHA-256 of kubectl linux/amd64, from kubectl.sha256 of the release
  # (research RS-18). No manager updates it: a PR of Renovate on
  # KUBECTL_VERSION fails here until the new sum is written by hand.
  KUBECTL_SHA256: 29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634
  # The same for linux/arm64, the runner of the job that scans the arm64
  # variant of the images: kubectl.sha256 of the release at
  # https://dl.k8s.io/release/v1.36.6/bin/linux/arm64/kubectl.sha256 (read on
  # 2026-11-26). Same rule: changed by hand with KUBECTL_VERSION.
  KUBECTL_SHA256_ARM64: 35507ef408c3d38849e5d3203e18f8e861db822aa664101a9ced0869edd06046
  # The Helm of the envoy-render job: the version that rendered
  # local/vendor/envoy-gateway/ (research RS-02, relevé du 2026-11-25), and the
  # SHA-256 of helm-v4.3.2-linux-amd64.tar.gz from get.helm.sh, equal to the
  # one in the notes of the release (read on 2026-11-25). No manager updates
  # the sum: a PR of Renovate on HELM_VERSION fails here until it is written by
  # hand, and the render is redone with that Helm in the same PR.
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2
  HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983

concurrency:
  group: golden-saas-b2b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: golden/saas-b2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release archives checked against tests/tools/SHA256SUMS before use,
      # without any third-party action.
      - name: Install the tools of task check
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/golden-tools"
          echo "$RUNNER_TEMP/golden-tools" >> "$GITHUB_PATH"

      # S06 renders the common layer with kubectl kustomize: the kubectl of
      # e2e-lite, checked against its SHA-256, before the one of the runner.
      - name: Install kind and kubectl
        working-directory: .
        run: |
          bash scripts/ci/install-kind-kubectl.sh "$RUNNER_TEMP/kind-tools"
          echo "$RUNNER_TEMP/kind-tools" >> "$GITHUB_PATH"

      - name: Run the static checks
        run: task check

  # U01 and U02: unit tests of the API and of the front, each in its build
  # image (research RS-06). The runner's Docker builds the test stages of
  # src/Api/Dockerfile and src/front/Dockerfile; neither .NET SDK nor
  # Node.js is installed. U03: the decision of the image scan, on example
  # reports. A required check, like static.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: golden/saas-b2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task and conftest
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/golden-tools"
          echo "$RUNNER_TEMP/golden-tools" >> "$GITHUB_PATH"

      - name: Run the unit tests
        run: task test

  # E27 on the images of the lite profile, without a cluster (spec 001, T117
  # and the second PR of step 18): the pulled ones (the node, the mirror,
  # Envoy Gateway and its proxy, Postgres, the cache, then each image that the
  # next steps add to the inventory, S25), and the two that the project builds,
  # the API and the front, which the scan builds with their Dockerfile and
  # reads from the engine of the runner. First with a database repository
  # under .invalid, where the scan must fail and say so, then for real, with
  # the database downloaded in this run and no cache (research RS-22). Trivy
  # comes from tests/tools/install.sh, checked against its SHA-256, never from
  # an action of Aqua Security (S26). The lock file of the front is scanned too,
  # with trivy fs, under the same policy: react and react-dom are compiled into
  # dist/, which no image scan sees. The SBOM of each built image and of that
  # lock file, CycloneDX JSON, is kept as an artifact of the run for 90 days
  # (retention-days: the maximum of a public repository unless its settings say
  # more, per the action.yml of upload-artifact v7.0.2, read on 2026-11-26;
  # FR-020, research RS-22). This job scans the linux/amd64 variant; scan-images-arm64 scans the other (decision
  # of the DSI, 2026-11-26). The move of the scan into e2e-lite (T123) is not
  # done. No path filter: a finding published after a merge fails the next PR
  # (plan, "SBOM et scan des images"). Required check of the ruleset of main.
  scan-images:
    name: scan-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: golden/saas-b2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy and conftest
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/golden-tools" trivy conftest
          echo "$RUNNER_TEMP/golden-tools" >> "$GITHUB_PATH"

      # kubectl renders local/k8s/<profile> for the inventory once step 8
      # writes it; its Kustomize reads no kubeconfig (research RS-24).
      - name: Install kind and kubectl
        working-directory: .
        run: |
          bash scripts/ci/install-kind-kubectl.sh "$RUNNER_TEMP/kind-tools"
          echo "$RUNNER_TEMP/kind-tools" >> "$GITHUB_PATH"

      - name: Scan the images and write their SBOM (E27)
        run: bash tests/scan/e27-pulled-images.sh --platform linux/amd64 --sbom-dir "$RUNNER_TEMP/sbom"

      - name: Keep the SBOM of the built images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-amd64
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90

  # The same scan for the linux/arm64 variant of every image, on an arm64
  # runner so that the API and the front build natively: the variant of a Mac
  # with Apple Silicon (D04). GitHub-hosted, free for a public repository
  # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners,
  # read on 2026-11-26). It installs the arm64 binaries of Trivy, conftest and
  # kubectl, each checked against its SHA-256. A required check of the ruleset
  # of main, like scan-images.
  scan-images-arm64:
    name: scan-images-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: golden/saas-b2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy and conftest
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/golden-tools" trivy conftest
          echo "$RUNNER_TEMP/golden-tools" >> "$GITHUB_PATH"

      - name: Install kind and kubectl
        working-directory: .
        run: |
          bash scripts/ci/install-kind-kubectl.sh "$RUNNER_TEMP/kind-tools"
          echo "$RUNNER_TEMP/kind-tools" >> "$GITHUB_PATH"

      - name: Scan the images and write their SBOM (E27)
        run: bash tests/scan/e27-pulled-images.sh --platform linux/arm64 --sbom-dir "$RUNNER_TEMP/sbom"

      - name: Keep the SBOM of the built images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-arm64
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90

  # X01: the golden repo as a project of its own, copied into a new Git
  # repository where its hooks, commitlint, actionlint and gitleaks run
  # (research RS-17). Outside the required checks until the DSI decides.
  export:
    name: export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: 4.7.0
      # Same interpreter as ci.yml, so the hooks build alike.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-golden-${{ runner.os }}-${{ hashFiles('golden/saas-b2b/.pre-commit-config.yaml') }}

      # X01 installs the hooks into the copy with `pre-commit install`, so
      # pre-commit has to stay on PATH; setup-uv adds the tool directory to
      # PATH on Windows only (research RS-18).
      - name: Install pre-commit
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tool-bin
        run: |
          uv tool install "pre-commit==${PRE_COMMIT_VERSION}"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Check a standalone copy of the golden repo (X01)
        run: bash golden/saas-b2b/tests/export/x01-standalone-copy.sh

  # Tests on kind of the lite profile (spec 001, T051, T061): E19, E22, E24
  # and the parts of E03 and E08 that steps 6 and 7 deliver; the steps after
  # them add theirs.
  # kind and kubectl come checked against their SHA-256 (ADR-004, condition
  # 5; research RS-18), Task from tests/tools/install.sh. The standard
  # profile is refused until step 12, hence PROFILE=lite (tasks.md, gap 14).
  # No path filter (research RS-17, relevé du 2026-11-25). Required check of
  # the ruleset of main.
  e2e-lite:
    name: e2e-lite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task and conftest
        working-directory: golden/saas-b2b
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/golden-tools"
          echo "$RUNNER_TEMP/golden-tools" >> "$GITHUB_PATH"

      # Before the kind and the kubectl of the runner on PATH.
      - name: Install kind and kubectl
        run: |
          bash scripts/ci/install-kind-kubectl.sh "$RUNNER_TEMP/kind-tools"
          echo "$RUNNER_TEMP/kind-tools" >> "$GITHUB_PATH"

      - name: Run the tests on kind (lite profile)
        working-directory: golden/saas-b2b
        env:
          PROFILE: lite
        run: task test:e2e

  # Gap 44 of spec 001 (tasks.md): the render of Envoy Gateway in
  # local/vendor/envoy-gateway/ is redone with helm template from the OCI
  # artifacts that local/tasks/local.yml names by digest, with the commands of
  # research RS-02, and compared byte for byte. S02 and S22 compare the
  # vendored files to their own sums and to references: they would pass a
  # render edited by hand and a SHA256SUMS redone. It also checks that the
  # proxy image of envoy-proxy.yaml is the default that the controller compiles.
  # A required check of the ruleset of main since the PR that pinned the proxy.
  # Pulls from docker.io, and reads shared_types.go of the controller tag from
  # raw.githubusercontent.com, anonymously; no credential.
  envoy-render:
    name: envoy-render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Helm checked against its SHA-256 before it is extracted, like kubectl.
      - name: Install Helm
        run: |
          bash scripts/ci/install-helm.sh "$RUNNER_TEMP/helm-tools"
          echo "$RUNNER_TEMP/helm-tools" >> "$GITHUB_PATH"

      # The check on its own failing cases, with a stand-in helm.
      - name: Test the render check
        run: bash tests/ci/check-envoy-gateway-render-test.sh

      - name: Redo the render of Envoy Gateway and compare it
        run: bash scripts/ci/check-envoy-gateway-render.sh
