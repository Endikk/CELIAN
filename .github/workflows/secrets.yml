name: secrets

on:
  # Every branch: a branch pushed without a PR is scanned too.
  push:
  # PRs opened by release-please with the workflow token do not trigger
  # push workflows, only pull_request ones (after approval).
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # Docker Hub, where Renovate reads the push date of a tag and counts the
  # 7 days itself (ADR-016, question 3). The release workflow of gitleaks
  # pushes the same index to Docker Hub and ghcr.io in one run. GitHub-hosted
  # runners pull public Docker Hub images without its rate limit.
  # renovate: datasource=docker depName=docker.io/zricethezav/gitleaks
  GITLEAKS_IMAGE: docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole git history with gitleaks
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose
