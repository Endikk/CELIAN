# The EnvoyProxy of the local layer (ADR-005, "Répartition par couche"):
# Envoy Gateway publishes the proxy through a NodePort Service with fixed
# node ports, which the extraPortMappings of local/kind/cluster.yaml reach
# on 127.0.0.1. The patch is a strategic merge on the ports of the Service,
# keyed by port (research RS-02). It fixes port 80, the HTTP listener of the
# Gateway; port 443 joins with the HTTPS listener, in the second PR of step
# 7 (T074): a port that the Service lacks would enter it without a name.
# S05 checks that each nodePort below is the containerPort of an
# extraPortMappings. Only the local layer names gateway.envoyproxy.io
# (ADR-005, condition 2; S06).
#
# The proxy image is pinned here, by tag and digest of the index, in the field
# envoyDeployment.container.image (ADR-005, complement of 2026-11-26). It is
# the value that Envoy Gateway 1.10.0 compiles as its default
# (DefaultEnvoyProxyImage), written down so that the repository names the
# image that runs: the scan inventory reads it (S25), Renovate follows its
# digest, and S05 refuses any other form. A new release of Envoy Gateway
# changes its default: the tag moves here by hand, in the same PR as the
# controller, the charts and the render (the tag is not a version that
# Renovate can order). This field takes precedence over the default of the
# controller, so a controller moved alone would keep the old Envoy: the job
# envoy-render (scripts/ci/check-envoy-gateway-render.sh) reads
# DefaultEnvoyProxyImage at the tag of the controller and refuses a different
# reference. The mirror serves the image read-only (S13, E03).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: saas-b2b
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
      envoyDeployment:
        container:
          # renovate: datasource=docker depName=docker.io/envoyproxy/envoy
          image: docker.io/envoyproxy/envoy:distroless-v1.40.2@sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
