# Tasks of the local layer, called by the public tasks of the root
# Taskfile.yml, which includes this file as internal. They run in the folder
# of the root Taskfile (research RS-09). Each stub below gives way to the
# real task in the step it names (spec 001, tasks.md).

version: '3'

tasks:
  # Preflight checks first, before anything is created (contracts/task-cli.md).
  # PROFILE forces the profile, given either way: PROFILE=lite task up, or
  # task up PROFILE=lite. Task does not export a command-line variable to the
  # commands, hence env; a PROFILE already in the environment wins over it
  # (research RS-08). The host ports join the call with step 7 (T059). The
  # rest of task up arrives with steps 6 to 9.
  up:
    silent: true
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - bash local/scripts/preflight.sh
      - echo 'The preflight checks passed, but task up stops here. The cluster, the mirror and the application arrive with steps 6 to 9 of spec 001.' >&2
      - exit 1

  down:
    silent: true
    cmds:
      - echo 'task down is not delivered yet. It arrives with step 6 of spec 001.' >&2
      - exit 1

  reload:
    silent: true
    cmds:
      - echo 'task reload is not delivered yet. It arrives with step 9 of spec 001.' >&2
      - exit 1
