# Tasks of the local layer, called by the public tasks of the root
# Taskfile.yml, which includes this file as internal. They run in the folder
# of the root Taskfile (research RS-09). The commands that
# create or remove a container, a network, a volume or a cluster, or that build
# or load an image, are listed at the head of the root Taskfile.yml (ADR-011,
# condition 11).

version: '3'

vars:
  # The zot mirror, by tag and digest (ADR-011, condition 8). A variable of
  # this file wins over the environment and the command line (research
  # RS-09): nobody swaps the image without changing this line. ghcr.io gives
  # Renovate no date: each update waits for the approval of ADR-016.
  # renovate: datasource=docker depName=ghcr.io/project-zot/zot
  MIRROR_IMAGE: ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7
  # The host ports of the gateway, on 127.0.0.1 (research RS-20): HTTP, and
  # HTTPS for its listener (T074). local/kind/cluster.yaml publishes them, the
  # preflight checks test them; S05 keeps both in step.
  GATEWAY_HTTP_PORT: "18080"
  GATEWAY_HTTPS_PORT: "18443"
  # Envoy Gateway, one release (ADR-005, "Versions et condensats"; research
  # RS-02): the controller image and the OCI artifacts of its two charts, by
  # tag and digest. local/vendor/envoy-gateway/ holds the render of these
  # charts; platform.sh and S22 refuse a render of another release. Renovate
  # proposes the three in one PR (group "Envoy Gateway" of renovate.json),
  # and the render and its sums are redone by hand in that PR, with the
  # commands of research RS-02.
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway
  ENVOY_GATEWAY_IMAGE: docker.io/envoyproxy/gateway:v1.10.0@sha256:c2243d43518bed91d3ed8c2db849a4b7a14ac9b96eb019f2ab104bb1ca8572b1
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm
  ENVOY_GATEWAY_HELM_IMAGE: docker.io/envoyproxy/gateway-helm:v1.10.0@sha256:dcb82a14c04b426615a71d97222c7edf9f5ff58b800d241e71ac5784ae6dc7b7
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-crds-helm
  ENVOY_GATEWAY_CRDS_HELM_IMAGE: docker.io/envoyproxy/gateway-crds-helm:v1.10.0@sha256:475c39aad3a05e3974a29fb80cfefe882b743e45e2ec0f751790ff0cb83bfa5d

tasks:
  # Preflight checks first, before anything is created (contracts/task-cli.md),
  # with the host ports of the gateway; then the cluster, the mirror, the
  # namespace of the application with the Secrets, the platform, the images,
  # the application layer, and the wait for "ready" (plan, "Ce que fait task
  # up", points 1 to 9). PROFILE forces the profile, given either way:
  # PROFILE=lite task up, or task up PROFILE=lite. Task does not export a
  # command-line variable to the commands, hence env; a PROFILE already in
  # the environment wins over it (research RS-08). The checks of the mirror,
  # of the vendored platform and of the files of the application come before
  # the cluster is created: a foreign container or volume, or a vendored file
  # that differs from its SHA-256, stops task up at once; only the network
  # kind, which kind creates, is checked after (mirror.sh up). The Secrets
  # come before the platform: the controller of Envoy Gateway watches the
  # namespace of the application, and its Role there needs the namespace
  # (ADR-005, complement of 2026-11-25; tasks.md, gap 92). The images come
  # before the application: the Deployments name them. Each step that takes
  # time goes through steps.sh, which prints its duration; UP_START is read
  # when the task starts, for the total (FR-015, E17).
  up:
    silent: true
    env:
      PROFILE: '{{.PROFILE}}'
    vars:
      UP_START:
        sh: date +%s
    cmds:
      - bash local/scripts/steps.sh run preflight -- bash local/scripts/preflight.sh '{{.GATEWAY_HTTP_PORT}}' '{{.GATEWAY_HTTPS_PORT}}'
      - bash local/scripts/mirror.sh check '{{.MIRROR_IMAGE}}'
      - bash local/scripts/platform.sh check '{{.ENVOY_GATEWAY_IMAGE}}'
      - bash local/scripts/app.sh check
      - bash local/scripts/steps.sh run cluster -- bash local/scripts/cluster.sh up
      - bash local/scripts/steps.sh run mirror -- bash local/scripts/mirror.sh up '{{.MIRROR_IMAGE}}'
      - task: secrets
      - bash local/scripts/steps.sh run platform -- bash local/scripts/platform.sh up '{{.ENVOY_GATEWAY_IMAGE}}'
      - bash local/scripts/steps.sh run images -- bash local/scripts/app.sh images
      - bash local/scripts/steps.sh run application -- bash local/scripts/app.sh apply
      - bash local/scripts/steps.sh run database -- bash local/scripts/app.sh database
      - bash local/scripts/steps.sh run cache -- bash local/scripts/cache.sh wait
      - bash local/scripts/steps.sh run ready -- bash local/scripts/app.sh ready '{{.GATEWAY_HTTP_PORT}}'
      - bash local/scripts/mirror.sh size
      - bash local/scripts/steps.sh total '{{.UP_START}}'

  # The namespace of the application, then the Secrets of the database, each
  # only when it is missing (contracts/secrets.md; ADR-007, condition 1).
  # Silent, as every task that handles a secret (S04): Task would print the
  # command before it runs it.
  secrets:
    silent: true
    cmds:
      - bash local/scripts/steps.sh run secrets -- bash local/scripts/secrets.sh up

  # The mirror container first, so that nothing stays on the network kind
  # when the cluster goes (ADR-011), then the cluster; the mirror volume
  # stays. Then what is left on the machine (contracts/task-cli.md).
  down:
    silent: true
    cmds:
      - bash local/scripts/mirror.sh down
      - bash local/scripts/cluster.sh down
      - bash local/scripts/mirror.sh report '{{.MIRROR_IMAGE}}'

  # The cluster stays; the mirror container goes as with task down, then the
  # namespace of the application, with the database, its volume and its
  # Secrets (contracts/task-cli.md). The profile standard will suspend the
  # binding of Flux first, once Flux is delivered (step 12). The next task up
  # recreates the Secrets, then the platform, whose Role in the namespace went
  # with it (tasks.md, gap 93).
  app-down:
    silent: true
    cmds:
      - bash local/scripts/mirror.sh down
      - bash local/scripts/app.sh down

  mirror-purge:
    silent: true
    cmds:
      - bash local/scripts/mirror.sh purge

  # The images of the API and the front again, loaded, then the manifests: the
  # steps of task up, defined once in app.sh (ADR-006, condition 6). The
  # database and its data are not touched; with the same sources, the same
  # images and so the same objects (E07).
  reload:
    silent: true
    cmds:
      - bash local/scripts/steps.sh run reload -- bash local/scripts/app.sh reload '{{.GATEWAY_HTTP_PORT}}'

  # The tests on kind of the current profile; the cluster is created, then
  # deleted (contracts/task-cli.md). Until step 12, PROFILE=lite.
  test-e2e:
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - bash local/tests/e2e/run.sh

  # The tests without a public registry of the current profile: E20, E23, E10
  # and E28 (contracts/task-cli.md). They start with the network, then cut the
  # registries in a copy of the golden repo; the cluster is created, then
  # deleted. Until step 12, PROFILE=lite.
  test-offline:
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - bash local/tests/offline/run.sh
