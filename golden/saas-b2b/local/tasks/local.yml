# Tasks of the local layer, called by the public tasks of the root
# Taskfile.yml, which includes this file as internal. They run in the folder
# of the root Taskfile (research RS-09). Each stub below gives way to the
# real task in the step it names (spec 001, tasks.md). The commands that
# create or remove a container, a network, a volume or a cluster are listed
# at the head of the root Taskfile.yml (ADR-011, condition 11).

version: '3'

vars:
  # The zot mirror, by tag and digest (ADR-011, condition 8). A variable of
  # this file wins over the environment and the command line (research
  # RS-09): nobody swaps the image without changing this line. ghcr.io gives
  # Renovate no date: each update waits for the approval of ADR-016.
  # renovate: datasource=docker depName=ghcr.io/project-zot/zot
  MIRROR_IMAGE: ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7
  # The host ports of the gateway, on 127.0.0.1 (research RS-20): HTTP, and
  # HTTPS for the listener of the second PR of step 7. local/kind/cluster.yaml
  # publishes them, the preflight checks test them; S05 keeps both in step.
  GATEWAY_HTTP_PORT: "18080"
  GATEWAY_HTTPS_PORT: "18443"
  # Envoy Gateway, one release (ADR-005, "Versions et condensats"; research
  # RS-02): the controller image and the OCI artifacts of its two charts, by
  # tag and digest. local/vendor/envoy-gateway/ holds the render of these
  # charts; platform.sh and S22 refuse a render of another release. Renovate
  # proposes the three in one PR (group "Envoy Gateway" of renovate.json),
  # and the render and its sums are redone by hand in that PR, with the
  # commands of research RS-02.
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway
  ENVOY_GATEWAY_IMAGE: docker.io/envoyproxy/gateway:v1.10.0@sha256:c2243d43518bed91d3ed8c2db849a4b7a14ac9b96eb019f2ab104bb1ca8572b1
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm
  ENVOY_GATEWAY_HELM_IMAGE: docker.io/envoyproxy/gateway-helm:v1.10.0@sha256:dcb82a14c04b426615a71d97222c7edf9f5ff58b800d241e71ac5784ae6dc7b7
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-crds-helm
  ENVOY_GATEWAY_CRDS_HELM_IMAGE: docker.io/envoyproxy/gateway-crds-helm:v1.10.0@sha256:475c39aad3a05e3974a29fb80cfefe882b743e45e2ec0f751790ff0cb83bfa5d

tasks:
  # Preflight checks first, before anything is created (contracts/task-cli.md),
  # with the host ports of the gateway; then the cluster, the mirror, the
  # namespace of the application with the Secrets, the platform, and the
  # application layer with Postgres (plan, "Ce que fait task up", points 2
  # to 8). PROFILE forces the profile, given either way: PROFILE=lite task
  # up, or task up PROFILE=lite. Task does not export a command-line
  # variable to the commands, hence env; a PROFILE already in the
  # environment wins over it (research RS-08). The API and the front arrive
  # with step 9. The checks of the mirror, of the vendored platform and of
  # the files of the application come before the cluster is created: a
  # foreign container or volume, or a vendored file that differs from its
  # SHA-256, stops task up at once; only the network kind, which kind
  # creates, is checked after (mirror.sh up). The Secrets come before the
  # platform: the controller of Envoy Gateway watches the namespace of the
  # application, and its Role there needs the namespace (ADR-005, complement
  # of 2026-11-25; tasks.md, gap 92).
  up:
    silent: true
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - bash local/scripts/preflight.sh '{{.GATEWAY_HTTP_PORT}}' '{{.GATEWAY_HTTPS_PORT}}'
      - bash local/scripts/mirror.sh check '{{.MIRROR_IMAGE}}'
      - bash local/scripts/platform.sh check '{{.ENVOY_GATEWAY_IMAGE}}'
      - bash local/scripts/app.sh check
      - bash local/scripts/cluster.sh up
      - bash local/scripts/mirror.sh up '{{.MIRROR_IMAGE}}'
      - task: secrets
      - bash local/scripts/platform.sh up '{{.ENVOY_GATEWAY_IMAGE}}'
      - bash local/scripts/app.sh up
      - echo 'task up stops after the database. The API and the front arrive with step 9 of spec 001.'

  # The namespace of the application, then the Secrets of the database, each
  # only when it is missing (contracts/secrets.md; ADR-007, condition 1).
  # Silent, as every task that handles a secret (S04): Task would print the
  # command before it runs it.
  secrets:
    silent: true
    cmds:
      - bash local/scripts/secrets.sh up

  # The mirror container first, so that nothing stays on the network kind
  # when the cluster goes (ADR-011), then the cluster; the mirror volume
  # stays. Then what is left on the machine (contracts/task-cli.md).
  down:
    silent: true
    cmds:
      - bash local/scripts/mirror.sh down
      - bash local/scripts/cluster.sh down
      - bash local/scripts/mirror.sh report '{{.MIRROR_IMAGE}}'

  mirror-purge:
    silent: true
    cmds:
      - bash local/scripts/mirror.sh purge

  reload:
    silent: true
    cmds:
      - echo 'task reload is not delivered yet. It arrives with step 9 of spec 001.' >&2
      - exit 1

  # The tests on kind of the current profile; the cluster is created, then
  # deleted (contracts/task-cli.md). Until step 12, PROFILE=lite.
  test-e2e:
    env:
      PROFILE: '{{.PROFILE}}'
    cmds:
      - bash local/tests/e2e/run.sh
