# Who reaches the cache on the local layer (ADR-015, condition 6): on TCP
# 6379, the pods of the API (label app.kubernetes.io/name: api, which the
# Deployment of the API carries from step 9) and the probe of task up and of
# E13 (cache-probe), in this namespace alone. The pod of the cache opens no
# connection: it is isolated for Egress, without any egress rule. The kubelet
# still reaches it, since traffic from the node of a pod is always admitted
# (research RS-11).
#
# kind applies NetworkPolicy from v0.24.0 on (ADR-015, S65); [OPS] confirms
# it under kind 0.33.0, and E13 proves it on each run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api
                  - cache-probe
      ports:
        - protocol: TCP
          port: 6379
