# Stand-ins for the two kinds of the gcp layer whose CRD this repository cannot
# pin: SecretProviderClass of the Secrets Store CSI driver (no CRD was read for
# it) and SecretSync of GKE (a service of Google, no published schema). E16
# applies them on kind so that Config Sync can apply the objects of the render;
# they accept any field, which is the point: E16 tests the binding, the render
# and the rights of the reconciler, not these two schemas, and S31 reads their
# fields (tasks.md, gap 180). Never applied anywhere but on the kind cluster of
# E16.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretproviderclasses.secrets-store.csi.x-k8s.io
spec:
  group: secrets-store.csi.x-k8s.io
  scope: Namespaced
  names:
    kind: SecretProviderClass
    listKind: SecretProviderClassList
    plural: secretproviderclasses
    singular: secretproviderclass
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsyncs.secret-sync.gke.io
spec:
  group: secret-sync.gke.io
  scope: Namespaced
  names:
    kind: SecretSync
    listKind: SecretSyncList
    plural: secretsyncs
    singular: secretsync
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
