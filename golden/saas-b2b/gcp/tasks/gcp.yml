# Tasks of the gcp layer (spec 001, step 13), included by the root
# Taskfile.yml under the gcp namespace. They run in the folder of the root
# Taskfile (research RS-09) and call the control scripts of the layer, so that
# the logic exists once: `task check` runs the same scripts through
# tests/run-static.sh.
#
# Principle X: no task here creates, changes or removes a cloud resource, and
# test S17 refuses one (tests/static/s17-workflows.sh). The first deployment
# is run by the user, with the agreement of Lucas and a budget validated by
# [FINOPS].

version: '3'

tasks:
  validate:
    desc: Check the format of the two OpenTofu roots, gcp/tofu/ and the budget root gcp/budget/, init each against its lock and validate it, without backend or credential (S14).
    cmds:
      - bash gcp/tests/static/s14-tofu-validate.sh

  policy:
    desc: Run the conftest policies of the gcp layer, their failing cases, then the policies on the two OpenTofu roots (S15).
    cmds:
      - bash gcp/tests/static/s15-tofu-policy.sh policy

  scan:
    desc: Scan the two OpenTofu roots with Trivy; each finding is fixed or justified next to its resource (S15).
    cmds:
      - bash gcp/tests/static/s15-tofu-policy.sh scan
