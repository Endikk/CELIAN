# The production composition of the gcp target (contracts/layers.md,
# "Composition Kustomize"): the prod overlay of the common layer, with the
# component of the gcp target on top. The RootSync of gcp/k8s/bootstrap/ names
# this folder as the one that Config Sync renders (spec.git.dir), and S07
# compares its render with the common overlay.
#
# It is a Kustomization, not a Component: a Component does not render on its
# own, and Config Sync renders the folder it is given (S10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s/overlays/prod
components:
  - ../component
