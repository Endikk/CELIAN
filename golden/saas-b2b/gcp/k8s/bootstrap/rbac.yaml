# The rights of the reconciler of the RootSync (ADR-010, condition 3; S10).
# Without spec.override.roleRefs Config Sync binds the reconciler to
# cluster-admin (type RootSyncOverrideSpec, GoogleContainerTools/
# kpt-config-sync at v1.25.2, read on 2026-11-26). With it, the reconciler gets
# these two roles and nothing else of the application:
#
# - saas-b2b-sync, a Role bound in the namespace of the application: the kinds
#   that the render of gcp/k8s/prod holds, no wildcard, no Secret (the sync of
#   GKE creates db-auth, not Config Sync), no RBAC object, no escalate. A
#   second environment gets its own Role and its own namespace, and cannot
#   write here.
# - saas-b2b-sync-cluster, a ClusterRole bound for the whole cluster, because
#   two kinds of the render are not in a namespace: the Namespace itself and
#   the admission policy and its binding (S16). It reads these three kinds,
#   reads (only) the kinds of the Role for the whole cluster, because the
#   status watcher lists them at that scope, and changes the Namespace and
#   the two objects by name. It creates
#   nothing: the create verb has no resource name in RBAC, so it cannot be
#   narrowed, and a repository that the reconciler obeys could add a policy
#   that refuses pods elsewhere. The user applies the Namespace, the policy and
#   its binding first, with this bootstrap (folder ../admission, also in the
#   component), and Config Sync then only updates them by name. S10 refuses a
#   create for the whole cluster, S07 asks for the two objects here (SECU
#   review of the PR 87; tasks.md, gap 176).
#
# Which verbs and kinds the reconciler needs to sync this render is read in
# the rules of Config Sync, not guessed: E16 on kind (T132) shows what it
# lacks, and the first test on GKE with it. S10 holds the shape: nothing wider.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saas-b2b-sync
  namespace: saas-b2b
rules:
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secret-sync.gke.io"]
    resources: ["secretsyncs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read only: the status of a Deployment is read from its ReplicaSets, and
  # theirs from their Pods (cli-utils, kstatus polling/statusreaders, read
  # on 2026-11-26). Config Sync waits on that status after the apply.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saas-b2b-sync-cluster
rules:
  - apiGroups: ["", "admissionregistration.k8s.io"]
    resources: ["namespaces", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
  # Read only, for the whole cluster, on the kinds of the Role. The render holds
  # cluster-scoped objects (the Namespace, the policy), so the status watcher of
  # Config Sync sees more than one namespace and lists every kind of the render
  # at the cluster scope (cli-utils, DefaultStatusWatcher: autoSelectRESTScopeStrategy,
  # read on 2026-11-26; E16 showed it: "cannot list resource secretsyncs ... at
  # the cluster scope"). Reading is all it gets: no Secret, no write.
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secret-sync.gke.io"]
    resources: ["secretsyncs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["saas-b2b"]
    verbs: ["update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames: ["saas-b2b-require-requests"]
    verbs: ["update", "patch", "delete"]
