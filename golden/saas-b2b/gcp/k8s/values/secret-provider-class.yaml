# What the sync of GKE reads for the Secret db-auth (ADR-007; contracts/
# secrets.md): the two secrets of Secret Manager that gcp/tofu/secrets.tf
# writes, one for each key of the Kubernetes Secret, named <name>-db-auth-
# username and <name>-db-auth-password after the variable `name` of the root.
# The class and its SecretSync (gcp/k8s/component/secret-sync.yaml) sit in the
# same namespace.
#
# Format of resourceName and of path: page "Sync Secret Manager secrets to
# Kubernetes Secrets" of Google, read on 2026-11-26. The page does not say that
# `latest` is a version, and its example writes a number: the version is a
# number. OpenTofu writes each secret once, which makes its first version 1
# (to read at the first apply, test of ADR-007, condition 3); a new
# secret_data_wo_version in the root makes a new version, and this file takes
# the number in a pull request (tasks.md, gap 144).
#
# PROJECT_ID is the placeholder of the project that holds the secrets, the
# variable project_id of the root. Written after the first apply, with the
# other values of this folder (research RS-16). It reads no secret as long as
# it is a placeholder. The prefix saas-b2b is the variable `name`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-auth
  namespace: saas-b2b
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/saas-b2b-db-auth-username/versions/1"
        path: "username"
      - resourceName: "projects/PROJECT_ID/secrets/saas-b2b-db-auth-password/versions/1"
        path: "password"
