# The Kubernetes service account that the sync of GKE acts as when it reads
# Secret Manager (ADR-007, condition 2): the one reader of the secrets of the
# application, through its principal of Workload Identity Federation for GKE,
# bound secret by secret in gcp/tofu/secrets.tf. Its name is the value of the
# variable app_service_account of the root, and the namespace is app_namespace:
# the two must agree, and no test can read the values of the user (tasks.md,
# gap 187); the test of ADR-007, condition 3, on GKE shows it.
#
# No pod runs as this account, and no token is mounted: the controller of the
# sync asks for a token of its own for the identity (page "Sync Secret Manager
# secrets to Kubernetes Secrets" of Google, read on 2026-11-26).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync
  namespace: saas-b2b
automountServiceAccountToken: false
