# The producer of the Secret db-auth on gcp (ADR-007; contracts/secrets.md):
# the sync of GKE creates a Kubernetes Secret of this name, with the two keys
# username and password, from the secrets that the SecretProviderClass db-auth
# reads (gcp/k8s/values/secret-provider-class.yaml). The application reads the
# same Secret, by the same mounted files, as on local, and does not know what
# produced it.
#
# The type is Opaque: the page of Google gives Opaque, tls and docker-registry
# as examples of secretObject.type and does not say that
# kubernetes.io/basic-auth, the type of db-auth on local, is accepted (read on
# 2026-11-26). The type is not part of the references that S07 compares (name,
# keys, reading by file). The test of ADR-007, condition 3, on GKE tries
# basic-auth, and a pass moves this line and the rule of S31 (tasks.md, gap
# 144).
#
# The page does not say what happens when a Secret of this name already exists
# (ADR-007, condition 3): none is versioned, and local creates its own only
# on local (S03).
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: db-auth
  namespace: saas-b2b
spec:
  serviceAccountName: secret-sync
  secretProviderClassName: db-auth
  secretObject:
    type: Opaque
    data:
      - sourcePath: username
        targetKey: username
      - sourcePath: password
        targetKey: password
