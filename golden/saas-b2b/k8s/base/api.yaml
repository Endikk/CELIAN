# The API of the example (spec 001, T087; contracts/http-api.md), the same
# on every target. Checked by S30 (policy/app_workloads.rego).
#
# - The image is under the reserved host saas-b2b.invalid, with a tag that
#   names no build: task up builds the image, gives it a tag drawn from the
#   image itself and sets it through Kustomize (local/scripts/app.sh;
#   research RS-07). The pull policy never asks a registry for it.
# - The restricted profile of the namespace: UID 1654 of the image, no
#   privilege escalation, every capability dropped, seccomp RuntimeDefault,
#   no service account token, a read-only root filesystem. ASP.NET Core
#   writes its temporary files to /tmp, an emptyDir with a size limit.
# - The image runs in the Production environment: nothing here sets
#   ASPNETCORE_ENVIRONMENT, so a failure shows no stack trace (S07).
# - Settings from app-config, which each target layer provides, read as
#   environment variables; the user and password of the database and the
#   password of the cache from the files of the mounted Secrets db-auth and
#   cache-auth, read-only and readable by the group of the pod only
#   (contracts/secrets.md, contracts/layers.md).
# - The label app.kubernetes.io/name: api is the one that the NetworkPolicies
#   of the database and the cache admit (tasks.md, gaps 104 and 122).
# - Readiness is /api/readyz, the database and the cache reachable; liveness
#   is /api/healthz, the process alone. Kestrel listens on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: saas-b2b.invalid/api:unbuilt
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-auth
              mountPath: /run/secrets/db-auth
              readOnly: true
            - name: cache-auth
              mountPath: /run/secrets/cache-auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-auth
          secret:
            secretName: db-auth
            defaultMode: 0440
        - name: cache-auth
          secret:
            secretName: cache-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
