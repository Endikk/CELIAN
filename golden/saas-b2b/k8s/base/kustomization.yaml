# The common layer of the application (contracts/layers.md, "Composition
# Kustomize"): the same objects on every target, with no tool and no
# provider in them (S06). The target layers add theirs through a component
# (research RS-01); the environments, through k8s/overlays/.
#
# The namespace and the routing (step 7), then the Deployments and the
# Services of the API and the front (step 9, T087).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saas-b2b
resources:
  - namespace.yaml
  - gateway.yaml
  - httproutes.yaml
  - api.yaml
  - front.yaml
