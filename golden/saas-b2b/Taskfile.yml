# Public tasks of the SaaS B2B golden repo (spec 001, contracts/task-cli.md).
# No logic here: each task delegates to a Taskfile of its layer, local/tasks/
# or gcp/tasks/, or to a script. A task not delivered yet fails with a
# sentence that says so.
#
# Inventory of the commands that create or remove a container, a network, a
# volume or a cluster (ADR-011, condition 11), reviewed by [SECU]. One line
# per command and file, checked by S04 (local/tests/static/s04-taskfile.sh).
# Each removal is preceded by a check of the name and the label, and of the
# image for a container: nothing that is not the project's is removed.
#   local/scripts/cluster.sh: kind create cluster
#   local/scripts/cluster.sh: kind delete cluster
#   local/scripts/mirror.sh: docker volume create
#   local/scripts/mirror.sh: docker container rm
#   local/scripts/mirror.sh: docker run
#   local/scripts/mirror.sh: docker volume rm
# Outside the inventory: `task test` builds the test stage of the API image
# with `docker build`, keeping the build cache and no image
# (tests/unit/u01-api.sh).

version: '3'

includes:
  # Helpers of the public tasks below, hidden from `task --list`.
  local:
    taskfile: ./local/tasks/local.yml
    internal: true
  # gcp:validate, gcp:policy and gcp:scan arrive with step 13 (T105), which
  # writes this file; `optional` goes away then.
  gcp:
    taskfile: ./gcp/tasks/gcp.yml
    optional: true

tasks:
  up:
    desc: Start or resume the local environment.
    cmds:
      - task: local:up

  down:
    desc: Remove the local cluster and the mirror container; keep the mirror volume.
    cmds:
      - task: local:down

  mirror:purge:
    desc: Remove the mirror volume; the next task up needs the network.
    cmds:
      - task: local:mirror-purge

  reload:
    desc: Rebuild and redeploy the API and the front, without touching the data.
    cmds:
      - task: local:reload

  check:
    desc: Run the static checks and the simulated preflight checks, without a cluster.
    cmds:
      - bash tests/run-static.sh

  test:
    desc: Run the unit tests of the API, the front and the scan decision.
    cmds:
      # U01, in the build image of the API: Docker, and no .NET SDK.
      - bash tests/unit/u01-api.sh

  test:e2e:
    desc: Run the tests on kind of the current profile; the cluster is created, then deleted.
    cmds:
      - task: local:test-e2e
