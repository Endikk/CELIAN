name: checks

# Static checks and unit tests. Each job calls a task of Taskfile.yml, so
# that the logic exists once, in the tasks, and runs the same on a machine.
# Principle X: no cloud credential, and no plan, apply or destroy; test S17
# (tests/static/s17-workflows.sh) enforces both in every workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release archives checked against tests/tools/SHA256SUMS before use,
      # without any third-party action.
      - name: Install the tools of task check
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Run the static checks
        run: task check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools of task check
        run: |
          bash tests/tools/install.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      # U01 and U02 in the build images of the API and of the front, with the
      # runner's Docker; neither .NET SDK nor Node.js on the runner.
      - name: Run the unit tests
        run: task test
