name: secrets

on:
  # Every branch: a branch pushed without a PR is scanned too.
  push:
  # PRs opened by release-please with the workflow token do not trigger
  # push workflows, only pull_request ones (after approval).
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # Renovate reads the tag on Docker Hub, which dates each push, so it counts
  # the 7 days itself (ADR-016 of CELIAN, question 3). The image is pulled
  # from ghcr.io by the same digest: the release workflow of gitleaks pushes
  # one index to both, and a digest pushed to Docker Hub alone fails the
  # pull, so a stolen Docker Hub login cannot slip an image in. Keep the two
  # names different.
  # renovate: datasource=docker depName=docker.io/zricethezav/gitleaks
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole git history with gitleaks
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose
