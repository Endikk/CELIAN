# nginx configuration of the front image (spec 001, step 4), the whole of
# it: it replaces the main configuration of the image. nginx runs under the
# non-root user of the image, so its pid file and temporary files live in
# /tmp, and it listens on 8080, an unprivileged port (research RS-05). The
# gateway sends it every path but /api, which goes to the API.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Redirects keep the host and port the browser used, the gateway's.
        absolute_redirect off;

        # The page loads code, styles and data from its own origin only, and
        # no other site may frame it.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
