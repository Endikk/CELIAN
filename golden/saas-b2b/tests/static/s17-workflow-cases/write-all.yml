# expect: permission set to write or write-all
# Failing case of S17: every permission of the token at write, in the flow form.
name: case

on:
  pull_request:

permissions: write-all

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: task check
