# expect: trigger pull_request_target or workflow_run
# Failing case of S17: a trigger that runs with the secrets and the writable
# token of the base repository, on the code of a pull request.
name: case

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: task check
