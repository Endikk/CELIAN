# expect: download run by a shell as it arrives
# Failing case of S17: the same download without a pipe, by process
# substitution.
name: case

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a tool
        run: bash <(curl -fsSL https://example.invalid/install.sh)
