# expect: job scan-images: has a job-level if
# Failing case of S32: the scan job, one of the four, that a condition turns
# off on pull requests. A step-level if is not what this case holds.
name: case

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/tools/install.sh "$RUNNER_TEMP/tools" task conftest tofu trivy kubectl
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: task test
  e2e-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/tools/install.sh "$RUNNER_TEMP/tools" task kind kubectl
      - env:
          PROFILE: lite
        run: task test:e2e
  scan-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/tools/install.sh "$RUNNER_TEMP/tools" trivy conftest kubectl
      - run: bash tests/scan/e27-pulled-images.sh
