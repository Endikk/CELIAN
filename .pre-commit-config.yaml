# Local quality gates. Install once per clone: pre-commit install
# CI runs the same hooks (.github/workflows/ci.yml).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Files generated by Spec Kit (`specify init`) stay as shipped, so a refresh
# does not fight the hooks. The constitution is ours and stays checked.
exclude: |
  (?x)^(
    \.specify/(templates|scripts|workflows|integrations)/.*|
    \.specify/(\.gitignore|init-options\.json|integration\.json)|
    \.specify/memory/\.constitution-template\.json|
    \.claude/skills/speckit-[a-z-]+/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Third-party files copied byte for byte (Apache-2.0 section 4(b)):
        # fixing them would turn them into modified files. The vendored
        # manifests of the golden repo are also checked against their
        # SHA256SUMS, which a fix would break (spec 001, T057). So are the JSON
        # schemas of golden/saas-b2b/tests/schemas/ (S08).
        exclude: ^(tests/bench/[^/]+/vendor/|golden/saas-b2b/local/vendor/|golden/saas-b2b/tests/schemas/)
      - id: end-of-file-fixer
        exclude: ^golden/saas-b2b/(local/vendor|tests/schemas)/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^golden/saas-b2b/(local/vendor|tests/schemas)/
      - id: check-yaml
        exclude: ^golden/
      # The golden repo keeps Kubernetes manifests with several documents per
      # file; elsewhere, one document per file (research RS-17).
      - id: check-yaml
        name: check yaml (golden repo, several documents allowed)
        files: ^golden/
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The CRDs of Envoy Gateway, rendered from their chart, weigh 2.8 MB
        # (spec 001, research RS-02); SHA256SUMS pins every vendored file.
        exclude: ^golden/saas-b2b/(local/vendor|tests/schemas)/
      - id: detect-private-key

  # Secret detection on staged changes. CI also scans the full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad  # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Upstream lints ^\.github/workflows/ only; the workflows of the
        # golden repo live in its own .github/workflows/ (research RS-17).
        files: ^(\.github/workflows/|golden/saas-b2b/\.github/workflows/)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  # Conventional Commits. Config: .commitlintrc.yaml
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Upstream reads .git/COMMIT_EDITMSG only. Passing the file lets CI
        # check a PR title with --commit-msg-filename.
        pass_filenames: true
        # Explicit language lets Renovate update additional_dependencies.
        language: node
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  # Catalog check (ADR-009): scripts/catalog/check_catalog.py and its tests.
  # Versions are exact, transitive dependencies included, so that pip builds
  # the same environment everywhere and Renovate applies its 7-day delay to
  # each package. Keep both lists in step.
  - repo: local
    hooks:
      - id: catalog-check
        name: check the service catalog (ADR-009)
        language: python
        entry: python scripts/catalog/check_catalog.py
        # Freshness depends on today's date, not on the changed files: every
        # entry is checked on every run.
        always_run: true
        pass_filenames: false
        # Warnings (open items, last month before expiry) show on success too.
        verbose: true
        additional_dependencies:
          - jsonschema==4.26.0
          - pyyaml==6.0.3
          - attrs==26.1.0
          - jsonschema-specifications==2025.9.1
          - referencing==0.37.0
          - rpds-py==2026.9.1
          - typing-extensions==4.16.0
      - id: catalog-check-tests
        name: test the catalog check
        language: python
        entry: pytest -p no:cacheprovider -q tests/catalog
        files: ^(catalog/|docs/(adr|benchmarks)/|schema/catalog-entry\.schema\.json$|scripts/catalog/|tests/catalog/)
        pass_filenames: false
        additional_dependencies:
          - jsonschema==4.26.0
          - pyyaml==6.0.3
          - attrs==26.1.0
          - jsonschema-specifications==2025.9.1
          - referencing==0.37.0
          - rpds-py==2026.9.1
          - typing-extensions==4.16.0
          - pytest==9.2.0
          - iniconfig==2.3.1
          - packaging==26.3
          - pluggy==1.7.0
          - pygments==2.21.0

  - repo: local
    hooks:
      - id: no-em-dash
        name: forbid the em dash character (U+2014)
        language: pygrep
        entry: '\xe2\x80\x94'  # UTF-8 bytes of U+2014, keeps this file free of it
        types: [text]
        # Third-party bytes, pinned by SHA256SUMS: a CRD description of Envoy
        # Gateway 1.10.0 holds the character (spec 001, research RS-02, T057).
        exclude: ^golden/saas-b2b/(local/vendor|tests/schemas)/
